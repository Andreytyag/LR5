name: CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: myintegration/app:${{ github.sha }}

      - name: Run unit tests
        run: |
          docker run --rm myintegration/app:${{ github.sha }} npm test

  # Деплой: задайте Secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, KUBE_CONFIG
  # и запускайте workflow вручную (workflow_dispatch) либо раскомментируйте push-триггер ниже.
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myintegration-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/myintegration-app:${{ github.sha }}

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install myintegration-release ./charts/myintegration-chart \
            --namespace devops-lab --create-namespace \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/myintegration-app \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always
